# Build the browser version of st3 and publish it on GitHub Pages.
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Browser version (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EMSDK_VERSION: 7.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Check the WebAssembly core matches the native build byte for byte
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          TMPDIR="$RUNNER_TEMP" web/wasmcheck.sh

      - name: Keep the check's outputs if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasmcheck-outputs
          path: ${{ runner.temp }}/wasmcheck-*
          retention-days: 7

      - name: Build the browser version
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make -C web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
