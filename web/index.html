<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scream Tracker 3</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1b1b1b">
<style>
  :root { --bg: #000; --bar: #1b1b1b; --fg: #d8d8d8; --dim: #8a8a8a; --accent: #a8955a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 4px 8px; background: var(--bar); flex-wrap: wrap; }
  #bar .title { font-weight: 600; color: var(--accent); margin-right: 8px; }
  #bar button, #bar label { background: #2c2c2c; color: var(--fg); border: 1px solid #444; border-radius: 4px; padding: 3px 10px; font: inherit; cursor: pointer; }
  #bar button:hover, #bar label:hover { background: #3a3a3a; }
  #status { color: var(--dim); margin-left: auto; }
  #wrap { display: flex; justify-content: center; align-items: center; flex: 1; min-height: 0; overflow: hidden; }
  #screen { display: block; background: #000; outline: none; }
  #hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2c2c2c; border: 1px solid #555;
          border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  #files { position: fixed; inset: 10% 20%; background: #1b1b1b; border: 1px solid #555; border-radius: 6px; padding: 12px 16px;
           overflow: auto; }
  #files a { color: var(--accent); }
  #files ul { font-family: ui-monospace, monospace; padding-left: 18px; }
  #help { color: var(--dim); }
  @media (max-width: 700px) { #files { inset: 5% 4%; } #help { display: none; } }
</style>
</head>
<body>
<div id="bar">
  <span class="title">Scream Tracker 3.21</span>
  <label>Add songs<input id="upload" type="file" multiple hidden accept=".s3m,.mod,.stm,.smp,.S3M,.MOD,.STM,.SMP"></label>
  <button id="filesbtn" type="button">Download files</button>
  <button id="backupbtn" type="button" title="Download everything in C:\ST3 as one .zip">Back up</button>
  <label title="Put the files from a backup .zip back into C:\ST3">Restore<input id="restore" type="file" hidden accept=".zip"></label>
  <button id="fullbtn" type="button">Full screen</button>
  <span id="help">Ctrl-L load · F5 play · F8 stop · F10 help · Ctrl-F then 1..0 = F1..F10 · Full screen lets ST3 use Ctrl-W/T/N</span>
  <span id="status">Loading…</span>
</div>
<div id="wrap"><canvas id="screen" tabindex="0" width="640" height="480"></canvas></div>
<div id="hint">Click here or press any key to turn on sound</div>
<div id="files" hidden>
  <strong>Files in C:\ST3</strong> (kept in this browser; click one to download it)
  <button id="closefiles" type="button" style="float:right">Close</button>
  <p id="storagenote" style="color:var(--dim)"></p>
  <ul id="filelist"></ul>
</div>
<script src="st3.js"></script>
</body>
</html>
